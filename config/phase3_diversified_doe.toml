# The product/analytical external-load field is not evidence of a
# corresponding production-deck external-load implementation.
# The production-deck *CLOAD check forbids direct preload CLOAD;
# it must not be interpreted as an external-force application step.
external_load_policy = "zero_only_until_new_solver_step_is_qualified"

# The M8/M12 sentinels establish two individual accepted states,
# not certification of the full proposed size-specific ranges.
cross_size_policy = "individual_anchors_only_pending_envelope_qualification"

