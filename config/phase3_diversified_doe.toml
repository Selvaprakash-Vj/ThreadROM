# Source-observed FEM capability boundary, pinned to Atlas V1.1.
# This section describes the CURRENT implementation.
# It does not certify the entire candidate geometry or preload envelope.
[observed_fem_capability_boundary]
status = "observed_not_full_domain_certification"
