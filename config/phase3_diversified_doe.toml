# ThreadROM Phase 3 — diversified FEM DOE
#
# DRAFT ENGINEERING DOMAIN. NOT AN EXECUTION AUTHORIZATION.
#
# This is a NEW campaign. Frozen C01 is not modified.
# Candidate ranges require physical-preparation, mesh, solver,
# acceptance-policy and atlas-integration qualification before execution.

[identity]
policy_id = "TRM-DDOE-000001"
campaign_id = "TRM-DDOE-001"
policy_name = "phase3_diversified_fem_doe_v1"
schema_version = 1
status = "draft_not_authorized"

[provenance]
baseline_commit = "801be26733a087c8b8635406f5bde724144feb2b"
baseline_atlas_path = "docs/phase3_fem_atlas/atlas.json"
baseline_atlas_sha256 = "eed5e52f4e9baaad5e2eb89634de48bbdf53c14c584921d8afb0df00631ffc60"
baseline_distinct_case_identities = 22
baseline_verified_configuration_count = 22
frozen_c01_must_remain_unchanged = true

[governance]
phase = 3
first_rom_phase = 4
solver_launch_authorized = false
geometry_or_mesh_execution_authorized = false
dataset_admission_authorized = false
surrogate_training_authorized = false
sealed_holdout_access_authorized = false
duplicate_accepted_case_rerun_forbidden = true
reuse_existing_evidence_before_new_fem = true
requested_and_realized_states_must_be_distinguished = true
preserve_valid_realized_states = true
preserve_failed_and_rejected_attempt_provenance = true
no_post_hoc_acceptance_relaxation = true
no_large_upfront_batch_authorization = true

[paired_material_rule]
bolt_and_nut_material_ids_must_match = true
head_and_nut_side_member_material_ids_must_match = true
fastener_and_member_material_groups_may_differ = true

# These are the currently evidenced BASELINE material IDs.
# Their presence does not certify other material combinations.
[baseline_materials]
fastener_material_id = "fastener_steel"
member_material_id = "steel_member"
bolt_property_class = "8.8"
nut_property_class = "8"

# First proposed cross-size cohort: explore the geometry/load
# parameters already represented by C01 and the two sentinels.
# These ranges are CANDIDATES, not certified executable limits.
[baseline_cohort]
status = "candidate_requires_factory_qualification"
thread_designations = ["M8x1.25", "M10x1.5", "M12x1.75"]
fixed_thread_friction_coefficient = 0.15
fixed_head_bearing_friction_coefficient = 0.15
fixed_nut_bearing_friction_coefficient = 0.15
fixed_member_interface_friction_coefficient = 0.15
fixed_external_axial_load_n = 0.0
fastener_material_id = "fastener_steel"
member_material_id = "steel_member"

# Nominal stress = requested preload / ISO tensile-stress area.
# Reference = 20 kN / M10x1.5 ISO tensile-stress area.
# The ratio 0.75–1.00 reproduces C01's 15–20 kN preload
# endpoints at M10; extrapolation to M8/M12 is NOT certified.
[candidate_preload]
coordinate_name = "nominal_preload_stress_ratio"
reference_thread_designation = "M10x1.5"
reference_preload_n = 20000.0
ratio_min = 0.75
ratio_max = 1.00
cross_size_range_qualification_required = true

# First candidate geometry follows the existing scale pattern.
# Upper/lower thicknesses sum to the size-specific total grip.
# Outer diameter and clearance hole remain COUPLED through
# the same radial fraction, as in C01.
[candidate_geometry]
head_member_grip_fraction_min = 0.40
head_member_grip_fraction_max = 0.50
member_outer_diameter_over_nominal_diameter_min = 3.0
member_outer_diameter_over_nominal_diameter_max = 3.6
clearance_hole_over_nominal_diameter_min = 1.10
clearance_hole_over_nominal_diameter_max = 1.20
outer_diameter_and_clearance_hole_share_radial_coordinate = true
upper_and_lower_members_share_radial_geometry = true
size_specific_geometry_and_mesh_qualification_required = true

# The baseline size rows are derived from historical sentinels
# and the existing M10/C01 configuration.
[[size_candidates]]
designation = "M8x1.25"
nominal_diameter_mm = 8.0
bolt_length_mm = 30.0
total_grip_mm = 16.0
historical_anchor_id = "TRM-XFEM-M8-001"

[[size_candidates]]
designation = "M10x1.5"
nominal_diameter_mm = 10.0
bolt_length_mm = 30.0
total_grip_mm = 20.0
historical_anchor_id = "D-BND-001"

[[size_candidates]]
designation = "M12x1.75"
nominal_diameter_mm = 12.0
bolt_length_mm = 40.0
total_grip_mm = 24.0
historical_anchor_id = "TRM-XFEM-M12-001"

# The diversified Phase-3 scope must eventually include governed
# material combinations, not merely the baseline steel cohort.
# Do not invent material IDs or assume a product-level resolver
# makes their FEM execution physically certified.
[material_expansion]
required_for_declared_diversified_scope = true
status = "pending_catalog_and_fem_qualification"
material_pair_allowlist_frozen = false
material_specific_physics_acceptance_verified = false
solver_launch_authorized = false

# External load is a separate physical input from preload.
# Its sign, application, range, steps and acceptance must be
# established in the actual FEM implementation before use.
[external_load_expansion]
required_for_declared_diversified_scope = true
status = "pending_load_path_and_acceptance_qualification"
load_bounds_frozen = false
load_step_and_boundary_semantics_verified = false
solver_launch_authorized = false

# Current preparation exposes common-friction semantics.
# Do not imply independent interface-friction execution exists.
[friction_expansion]
status = "not_in_initial_executable_cohort"
independent_interface_friction_qualification_required = true
solver_launch_authorized = false

[design_governance]
candidate_generation_authorized = false
design_size_frozen = false
holdout_allocation_frozen = false
sufficiency_policy_frozen_for_this_domain = false
cross_size_transfer_accuracy_criteria_frozen = false
all_design_points_must_pass_canonical_duplicate_check = true
all_proposed_points_must_be_compared_with_atlas = true
existing_certified_cases_must_not_be_rerun_to_fill_design_slots = true
holdouts_must_be_sealed_before_diagnostic_fitting = true

[atlas_integration]
registry_path = "docs/phase3_fem_atlas/atlas.json"
future_accepted_cases_must_append_to_same_registry = true
full_input_resolver_required_before_execution = true
accepted_evidence_registration_required = true
